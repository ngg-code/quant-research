[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qresearch"
version = "0.1.0"
description = "Python research library for systematic equity strategies"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "pyarrow", "openpyxl", "matplotlib",
  "statsmodels", "yfinance", "pandas-datareader", "pandas-market-calendars",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]